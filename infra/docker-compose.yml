# Local mirror + viewer for the Research Radar.
#   cp .env.example .env && docker compose up -d --build
# Then open http://127.0.0.1:8080 and import data (see infra/README.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@db:5432/radar
      FILES_DIR: /data/files
      PAGE_FILE: /app/radar.html
    ports:
      - "127.0.0.1:${RADAR_PORT:-8787}:8080"
    volumes:
      - files:/data/files
      - ../dist/radar.html:/app/radar.html:ro

volumes:
  pgdata:
  files:
